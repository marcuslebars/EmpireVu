apply plugin: 'com.android.application'

// Release signing reads android/keystore.properties (never committed) or, in CI, the
// ANDROID_KEYSTORE_* environment variables. Without either, release builds are unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String env -> keystoreProperties.getProperty(key) ?: System.getenv(env) }

// Play requires a strictly increasing versionCode for every upload, so a release built
// without one would be rejected — or silently overwrite what CI last shipped. Debug builds
// keep working with no environment at all.
def versionCodeEnv = System.getenv("ANDROID_VERSION_CODE")
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.project == project && it.name ==~ /(?i).*(assemble|bundle)release.*/ }
    if (buildingRelease && !versionCodeEnv) {
        throw new GradleException(
            "ANDROID_VERSION_CODE is not set. Release builds need an explicit, strictly increasing version code " +
            "(CI passes github.run_number). Set ANDROID_VERSION_CODE, or build a debug variant instead."
        )
    }
}

android {
    namespace = "com.empirevu.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.empirevu.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Checked above: unset is fatal for release, and only debug falls back to 1.
        versionCode ((versionCodeEnv ?: "1") as Integer)
        // Same source as the version code, so a build is identifiable in Play Console.
        versionName (System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
